name: app

on:
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test -- --ci
      - name: Navigateur des tests web
        run: npx playwright install --with-deps chromium
      - name: Parcours web critiques (export statique + Playwright)
        run: npm run e2e
        env:
          CI: '1'

  audit:
    # Failles des dépendances livrées dans l'app (les dépendances de dev ne bloquent pas).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit des dépendances livrées (haute ou critique)
        run: npm audit --omit=dev --audit-level=high
