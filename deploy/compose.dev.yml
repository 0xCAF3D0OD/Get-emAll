# Base PostgreSQL de développement pour l'API (docs/api-plan.md, lot 1).
# Lancer : docker compose -f deploy/compose.dev.yml up -d
# Mots de passe factices, pour le poste de développement seulement (règle S-2).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: getemall_owner
      POSTGRES_PASSWORD: fictif-owner
      POSTGRES_DB: getemall
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - getemall-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  getemall-postgres:
